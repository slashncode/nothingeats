# Toolchain for the whole NothingEats workspace.
# `just link-toolchain` links this file into the workspace root so every sibling repo uses it;
# `mise install` installs everything; Renovate keeps the pins fresh.

[tools]
java = "temurin-25.0.5+8.0.LTS"
node = "24.22.1"
pnpm = "12.15.0"
just = "1.59.0"
k3d = "5.9.0"
kubectl = "1.36.5"   # matches the k3s version in k3d/cluster.yaml
flux2 = "2.9.6"
helm = "4.3.1"
tilt = "0.37.8"
buf = "1.75.0"
sops = "3.13.3"
age = "1.3.2"
kubeconform = "0.8.0"
